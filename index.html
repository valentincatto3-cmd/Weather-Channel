<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Channel</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="main-container">
        <h1>Weather Channel</h1>
        
        <div class="search-box">
            <input type="text" id="input-ciudad" placeholder="Ingresá una ciudad...">
            <button id="btn-buscar">Buscar</button>
        </div>

        <div class="container">
            <ul>
                <li>
                    <span id="ciudad">Ciudad</span><br>
                    <span id="temperatura">--</span><span>°C</span><br>
                    <img id="icono" alt="Ícono del tiempo" src=""><br>
                    <span id="descripcion">Descripción</span><br>
                </li>
            </ul>
        </div>
    </div>

</body>
</html>
